# archlinux: ThinkPad, Intel iGPU drives every connector, NVIDIA dGPU for
# offload only. Included from ../config.

# swaync's GTK renderer would otherwise open the NVIDIA Vulkan driver and keep
# the dGPU awake.
exec env VK_DRIVER_FILES=/usr/share/vulkan/icd.d/intel_icd.json swaync

set $monitor "HP Inc. HP U28 4K HDR 1CR20606PP"
set $second_monitor "AOC 27G2WG3- 1TMP6HA010233"
output eDP-1 resolution 1920x1200 position 0,0 scale 1
output $monitor mode 3840x2160@59.997Hz scale 1.5

workspace 1 output eDP-1
workspace 3 output eDP-1
workspace 5 output eDP-1

workspace 2 output $monitor
workspace 4 output $monitor
workspace 6 output $monitor
