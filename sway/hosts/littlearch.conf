# littlearch: desktop, Radeon RX 6600 (03:00.0) drives both monitors.
# Included from ../config.

exec swaync

set $left_screen "HKC OVERSEAS LIMITED GN02 00000000"
set $right_screen "HKC OVERSEAS LIMITED 27E1QA 0000000000001"
output $left_screen mode 1920x1080@240.299Hz position 0 0
output $right_screen mode 2560x1440@144.0000Hz

workspace 1 output $left_screen
workspace 3 output $left_screen

workspace 2 output $right_screen
workspace 4 output $right_screen

# Lock 10s before the shared swayidle turns the outputs off.
exec swayidle timeout 300 'waylock'

bindsym $mod+slash exec ydotool click 0xC1
